# De tekst van de artikelen in de planregels, per link uit
# bestemmingen.json. Zie planregels.py.
#
# EIGEN WORKFLOW EN WACHTRIJ (28 november). In de wachtrij van de keten van
# bestemming.yml mag een run met alles een wachtende ronde annuleren; deze
# hoort daar dus niet. Donderdag, de dag na de wekelijkse ronde van
# bestemming.yml, zodat nieuwe links meteen tekst krijgen.

name: Planregels

on:
  schedule:
    - cron: "41 3 * * 4"
  workflow_dispatch:
    inputs:
      minuten:
        description: "Tijdbudget in minuten."
        default: "20"

concurrency:
  group: planregels
  cancel-in-progress: false

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      # DE NIEUWSTE STAND, NIET DIE VAN HET MOMENT VAN STARTEN (28 november).
      # Zonder ref haalt checkout de commit op van het moment dat de run in
      # de wachtrij kwam. Een run die achter een andere wachtte (05:12 in de
      # rij, 07:06 gestart), begon zo met een planregels.json van voor de vorige
      # ronde, en zette dat oudere bestand terug: van 1.864 panden met
      # verwijzingen bleven er 1.295 over. Met de naam van de tak haalt
      # checkout de stand op bij de start.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Proef
        run: |
          python3 planregels.py --proef
          python3 omgevingsvisie.py --proef

      - name: Ophalen
        run: python3 planregels.py --minuten "${{ github.event.inputs.minuten || '20' }}"

      # De Omgevingsvisie per stadsdeel (omgevingsvisie.py). Een pagina, dus
      # mee in dezelfde wekelijkse ronde.
      - name: Omgevingsvisie
        continue-on-error: true
        run: python3 omgevingsvisie.py

      - name: Terugcommitten
        run: |
          set -o pipefail
          ./terugcommitten.sh "Planregels $(date -u +%F)" planregels.json planregels_verslag.md omgevingsvisie.json omgevingsvisie_verslag.md \
            2>&1 | tee /tmp/terugcommit.log
          exit "${PIPESTATUS[0]}"
